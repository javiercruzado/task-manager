spring.application.name=taskmanager-api

# Server port configuration (defaults to 8080, can be overridden via SERVER_PORT or APP_PORT)
server.port=${SERVER_PORT:${APP_PORT:8080}}

# Datasource configuration (supports local Docker or cloud PostgreSQL like Neon, Supabase, Railway)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:taskmanager}${POSTGRES_PARAMS:}}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:d3v3l0p3r}

# Redis configuration (supports local Docker, Upstash Serverless, or managed cloud Redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# CORS configuration for decoupled frontend hosting (comma-separated list, e.g. https://my-app.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# JWT Configuration
app.jwt.access-expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA/Hibernate configuration
# Disable Hibernate DDL auto-generation as Flyway will manage the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
